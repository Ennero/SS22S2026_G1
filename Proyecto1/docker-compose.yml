services:
  postgres:
    image: postgres:16-alpine
    container_name: sgfood_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sgfood_dw}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_init_databases.sh:/docker-entrypoint-initdb.d/01_init_databases.sh:ro
      - ./Data/sgfood_oltp.sql:/docker-entrypoint-initdb.d/sgfood_oltp.sql:ro
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sgfood_dw"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: sgfood_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/airflow
    command: >
      bash -c "
        echo '[INIT] Migrando base de datos de Airflow...' &&
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@sgfood.com || true
      "
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dbt_sgfood:/opt/airflow/dbt_sgfood
      - ./elt:/opt/airflow/elt
      - ./Data:/opt/airflow/Data
      - ./sql:/opt/airflow/sql

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: sgfood_airflow
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-sgfood_secret_key_airflow_2026}
      PYTHONPATH: /opt/airflow
      DBT_PROFILES_DIR: /opt/airflow/dbt_sgfood
      DBT_PROJECT_DIR: /opt/airflow/dbt_sgfood
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: sgfood_dw
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8080:8080"
    command: >
      bash -c "
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@sgfood.com 2>/dev/null || airflow users reset-password --username admin --password admin
        (
          echo '[AUTORUN] Esperando que Airflow Scheduler este listo para disparar el pipeline...'
          sleep 12
          airflow dags unpause sgfood_elt_pipeline 2>/dev/null || true
          airflow dags trigger sgfood_elt_pipeline 2>/dev/null || true
          echo '[AUTORUN] Pipeline sgfood_elt_pipeline disparado automaticamente.'
        ) &
        exec airflow standalone
      "
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dbt_sgfood:/opt/airflow/dbt_sgfood
      - ./elt:/opt/airflow/elt
      - ./Data:/opt/airflow/Data
      - ./sql:/opt/airflow/sql

  adminer:
    image: adminer:latest
    container_name: sgfood_adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
