services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ss2_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-C",
          "-S",
          "localhost",
          "-U",
          "sa",
          "-P",
          "${DB_PASSWORD}",
          "-Q",
          "SELECT 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  etl:
    build:
      context: ../Practica1
      dockerfile: Dockerfile
    container_name: ss2_etl
    environment:
      DB_SERVER: "sqlserver,1433"
      DB_NAME: "${DB_NAME:-VuelosDW}"
      DB_USER: "${DB_USER:-sa}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_DRIVER: "${DB_DRIVER:-ODBC Driver 18 for SQL Server}"
      RAW_DATA_PATH: "dataset_vuelos_crudo.csv"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ../Practica1/logs:/app/logs
      - ../Practica1/data:/app/data

volumes:
  sqlserver_data:
